title: Tech News Daily
description: Automated daily tech news, generated fresh every day.
baseurl: "/tech-news-blog"
url: "https://dev-adquark.github.io"

markdown: kramdown
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Set this to your real GA4 Measurement ID (format: G-XXXXXXXXXX) to enable analytics.
google_analytics: ""

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
