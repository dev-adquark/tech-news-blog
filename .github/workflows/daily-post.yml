name: Daily Tech News Post

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      news_query:
        description: "Optional topic to search instead of general top tech headlines (e.g. 'cybersecurity')"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate today's post
        id: generate
        continue-on-error: true
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          NEWS_QUERY: ${{ github.event.inputs.news_query }}
        run: python scripts/generate_post.py

      - name: Commit and push new post (and debug log)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ debug_log.txt || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily post / debug: $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Fail job if generation failed
        if: steps.generate.outcome == 'failure'
        run: exit 1
        # Pushing to main automatically triggers a GitHub Pages rebuild,
        # since Pages is configured to build Jekyll from the main branch.
