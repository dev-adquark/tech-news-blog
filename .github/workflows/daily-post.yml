name: Daily Tech News Post

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC daily
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate today's post
        env:
          FREEBLOGAPI_KEY: ${{ secrets.FREEBLOGAPI_KEY }}
        run: python scripts/generate_post.py

      - name: Commit and push new post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily post: $(date +'%Y-%m-%d')"
          git push
        # Pushing to main automatically triggers a GitHub Pages rebuild,
        # since Pages is configured to build Jekyll from the main branch.
